<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ensures proper rendering and touch zooming on all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youtube Video Embed</title>
  </head>
  <body>
    <!-- 
      <iframe>: Inline frame used to embed another HTML page or content (like a YouTube video) inside the current page.

      Attributes explanation:

      - src: The URL of the page/content to embed.
        In this case, it's a YouTube embed link of the video (not the regular watch?v=... URL).
        Example format: https://www.youtube.com/embed/[videoID]

      - frameborder: Controls the presence of a border around the iframe.
        A value of "0" means no border. Deprecated in HTML5 but still works in many browsers.

      - width: Defines the width of the iframe. Can be in px (pixels) or % (percentage).
        Here, "100%" means the iframe will take full width of its parent container.

      - height: Defines the height of the iframe.
        Here, "925px" sets a fixed height in pixels.

      - title: Improves accessibility by describing the content inside the iframe.
        Screen readers will read this out to visually impaired users.

      - allow: A list of features that the iframe is permitted to use.
        ● accelerometer: Allows use of device motion sensor.
        ● autoplay: Allows video to start automatically (if allowed by browser policy).
        ● clipboard-write: Allows the iframe content to copy to clipboard.
        ● encrypted-media: Allows usage of DRM-protected media.
        ● gyroscope: Allows motion sensing using the gyroscope.
        ● picture-in-picture: Allows the video to pop out in a floating window.
        ● web-share: Enables access to the Web Share API.

      - allowfullscreen: Boolean attribute that allows the embedded video to be viewed in fullscreen.
    -->
    <iframe
      src="https://www.youtube.com/embed/CVFFcgvdLts"
      frameborder="0"
      width="100%"
      height="925px"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
    ></iframe>
  </body>
</html>
