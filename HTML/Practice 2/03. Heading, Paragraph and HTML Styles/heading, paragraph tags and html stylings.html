<!DOCTYPE html>

<html>
  <head>
    <title>Basic Structure</title>
  </head>

  <body>
    <!-- heading tags/elements -->
    <h1>h1 heading tag (largest)</h1>
    <h2>h2 heading tag (second largest, smaller than h1)</h2>
    <h3>h3 heading tag (third largest, smaller than h2)</h3>
    <h4>h4 heading tag (fourth largest, smaller than h3)</h4>
    <h5>h5 heading tag (fifth largest, smaller than h4)</h5>
    <h6>h6 heading tag (smallest)</h6>
  </body>
</html>
