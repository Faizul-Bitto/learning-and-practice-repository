<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>internal js</title>
  </head>
  <body>
    <button onclick="getDate()">Show Date</button>

    <p id="showDate"></p>

    <script>
      function getDate() {
        document.getElementById("showDate").innerHTML = Date();
      }
    </script>
  </body>
</html>
