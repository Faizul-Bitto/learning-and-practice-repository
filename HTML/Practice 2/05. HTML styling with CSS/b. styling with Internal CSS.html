<!DOCTYPE html>

<html>
  <head>
    <title>Internal CSS</title>
    <!-- This is an example of internal CSS. It is written inside a <style> tag within the <head> section and applies styles to the entire HTML document -->
    <style>
      p {
        color: brown;
      }
    </style>
  </head>

  <body>
    <p>This is a paragraph</p>
  </body>
</html>
