<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordered List</title>
  </head>
  <body>
    <!-- 
    This is an ordered list (<ol>) where items are automatically numbered using lowercase letters (a, b, c...). We can also capital letters (A, B, C...), even roman numbers (i, ii, iii...).

      - 'type="a"' sets the list style to lowercase alphabet.
      - 'type="A"' sets the list style to uppercase alphabet.
      - 'type="i"' sets the list style to lowercase roman numbers.
      - <li> tags define each list item.
    -->
    <ol type="a">
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ol>

    <ol type="A">
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ol>

    <ol type="i">
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ol>

    <ol type="i">
      <li>Rice</li>
      <li>Dal</li>
      <li>Meat</li>
      <ol type="a">
        <li>Chicken</li>
        <li>Beef</li>
      </ol>
      <li>Oil</li>
    </ol>
  </body>
</html>
