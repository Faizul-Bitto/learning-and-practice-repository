<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Tag</title>
  </head>
  <body>
    <!-- 
    This is an <img> tag that displays an image from an external URL using the 'src' attribute.
        - 'alt' provides alternative text if the image fails to load (also helps with accessibility).
        - 'title' shows a tooltip when hovering over the image.
    -->
    <img
      src="https://img.freepik.com/premium-photo/sand-road-green-field-tree_559599-14.jpg?ga=GA1.1.8333300.1743508604&semt=ais_hybrid&w=740"
      alt="nature"
      title="nature"
    />
  </body>
</html>
