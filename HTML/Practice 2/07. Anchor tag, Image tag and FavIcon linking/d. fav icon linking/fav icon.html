<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 
    This <link> tag sets a favicon (favorite icon) for the webpage.
      - 'rel="shortcut icon"' specifies it's a favicon.
      - 'href' provides the image URL to be used as the icon.
      - 'type' defines the file type of the icon (image/x-icon).

    This icon appears in the browser tab beside the page title.
    -->
    <link
      rel="shortcut icon"
      href="https://img.icons8.com/?size=100&id=BdjA3Y8bTxW8&format=png&color=000000"
      type="image/x-icon"
    />
    <title>fav icon</title>
  </head>
  <body></body>
</html>
