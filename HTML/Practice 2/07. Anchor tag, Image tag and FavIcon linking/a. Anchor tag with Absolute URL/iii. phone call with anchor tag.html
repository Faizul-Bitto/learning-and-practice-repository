<!DOCTYPE html>

<html>
  <head>
    <title>Phone Call with Anchor Tag</title>
  </head>

  <body>
    <!-- This anchor tag uses the 'tel:' scheme to create a clickable phone number. When clicked, it will prompt the user to call the number — works best on mobile devices -->
    <a href="tel:0123456789" target="_blank" title="Phone Number"
      >Phone Number (works best on mobile devices)
    </a>
  </body>
</html>
