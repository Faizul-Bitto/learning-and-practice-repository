<!DOCTYPE html>

<html>
  <head>
    <title>Anchor Tag with Relative URL</title>
  </head>

  <body>
    <!-- 
    This anchor tag uses a **relative URL** (./demo.html) to link to another page within the same project or directory.
      - './' refers to the current folder.
      - Clicking the link will open demo.html in a new tab (because of target="_blank").

    This is different from an absolute URL, which includes the full website link (like https://...)
    -->
    <a href="./demo.html" target="_blank" title="Demo">Demo</a>
  </body>
</html>
