<!DOCTYPE html>

<html>
  <head>
    <title>Predefined Colors</title>
  </head>

  <body>
    <!-- Using predefined color names in CSS. These are standard color names recognized by all browsers, such as 'red', 'green', 'blueviolet', etc. -->
    <p style="color: blueviolet">This is a paragraph</p>
    <p style="color: red">This is a paragraph</p>
    <p style="color: green">This is a paragraph</p>
    <p style="color: yellow">This is a paragraph</p>
    <p style="color: orange">This is a paragraph</p>
  </body>
</html>
