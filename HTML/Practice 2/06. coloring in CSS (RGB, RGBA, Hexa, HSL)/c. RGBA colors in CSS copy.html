<!DOCTYPE html>

<html>
  <head>
    <title>RGBA Colors</title>
  </head>

  <body>
    <!-- RGBA stands for Red, Green, Blue, and Alpha (opacity). The syntax is rgba(red, green, blue, alpha), where red, green, and blue values range from 0 to 255, and alpha (transparency) ranges from 0 (fully transparent) to 1 (fully opaque) -->
    <p style="color: rgba(26, 26, 161, 0.3)">This is a paragraph</p>
    <p style="color: rgba(159, 2, 2, 0.4)">This is a paragraph</p>
    <p style="color: rgba(23, 82, 23, 0.5)">This is a paragraph</p>
    <p style="color: rgba(196, 196, 18, 0.6)">This is a paragraph</p>
    <p style="color: rgba(152, 112, 37, 1)">This is a paragraph</p>
  </body>
</html>
