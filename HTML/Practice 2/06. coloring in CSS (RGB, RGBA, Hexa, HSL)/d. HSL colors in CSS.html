<!DOCTYPE html>

<html>
  <head>
    <title>Basic Structure</title>
  </head>

  <body>
    <!-- The following paragraphs use HSL (Hue, Saturation, Lightness) color values to set the text color. Hue sets the base color (0–360), Saturation controls color intensity (0%–100%), and Lightness adjusts brightness (0%–100%) -->
    <p style="color: hsl(60, 81%, 45%)">This is a paragraph</p>
    <p style="color: hsl(141, 41%, 54%)">This is a paragraph</p>
    <p style="color: hsl(248, 65%, 45%)">This is a paragraph</p>
    <p style="color: hsl(0, 0%, 35%)">This is a paragraph</p>
    <p style="color: hsl(202, 41%, 61%)">This is a paragraph</p>
  </body>
</html>
