<!DOCTYPE html>

<html>
  <head>
    <title>Basic Structure</title>
  </head>

  <body>
    <!-- The following paragraphs use Hex color codes to set the text color. Hex codes are 6-digit values starting with '#' and represent colors using combinations of red, green, and blue (RGB). Each pair (RR, GG, BB) is a hexadecimal value from 00 to FF -->
    <p style="color: #ff0000">This is a paragraph</p>
    <p style="color: #00ff00">This is a paragraph</p>
    <p style="color: #0000ff">This is a paragraph</p>
    <p style="color: #ffff00">This is a paragraph</p>
    <p style="color: #ff00ff">This is a paragraph</p>
  </body>
</html>
