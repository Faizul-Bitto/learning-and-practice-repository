<!DOCTYPE html>

<html>
  <head>
    <title>RGB Colors</title>
  </head>

  <body>
    <!-- RGB stands for Red, Green, and Blue. The syntax is rgb(red, green, blue), where each value ranges from 0 to 255. These values are combined to produce a specific color -->
    <p style="color: rgb(26, 26, 161)">This is a paragraph</p>
    <p style="color: rgb(159, 2, 2)">This is a paragraph</p>
    <p style="color: rgb(23, 82, 23)">This is a paragraph</p>
    <p style="color: rgb(196, 196, 18)">This is a paragraph</p>
    <p style="color: rgb(152, 112, 37)">This is a paragraph</p>
  </body>
</html>
